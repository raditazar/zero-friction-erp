version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: zero_friction_erp_e2e
    ports:
      - "5433:5432"
    volumes:
      - e2e_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d zero_friction_erp_e2e"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  e2e_pgdata:
