services:
  postgres:
    image: postgres:16-alpine
    container_name: zero-friction-erp-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zero_friction_erp}
      POSTGRES_USER: ${POSTGRES_USER:-zero_friction_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting PostgreSQL}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zero_friction_erp} -d ${POSTGRES_DB:-zero_friction_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
